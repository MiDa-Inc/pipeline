side_effects:
  - assert: no_git_writes
    detail: R14. The engine performs no commit, reset or checkout at any point in this run. A later engine test observes this by running against a scratch repository and asserting the git ref log and index are unchanged.
  - assert: guard_baseline_preserved
    detail: R6. The reviewer is read-only, so a fresh snapshot is taken before its turn and compared after it. A later runtime test observes the snapshot/compare pair around the reviewer turn only.
